name: collect

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub 사정으로 몇 분~수십 분 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 판매량 기록은 data 브랜치에 커밋한다 → main(Pages)은 재배포되지 않는다
      - uses: actions/checkout@v4
        with:
          ref: data
          path: databranch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx puppeteer browsers install chrome
      - run: node scripts/collect.js
        env:
          DATA_DIR: databranch
      - name: commit data
        working-directory: databranch
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: $(jq -r .aggregatedAt status.json) 판매량 $(jq -r .totalSales status.json)"
          git pull --rebase
          git push
